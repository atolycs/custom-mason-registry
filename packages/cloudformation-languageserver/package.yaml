name: cloudformation-languageserver
description: AWS Cloudformation Language Server
homepage: https://github.com/aws-cloudformation/cloudformation-languageserver
licenses:
  - Apache-2.0
languages:
  - YAML
  - JSON
  - Cloudformation
categories:
  - LSP
source:
  id: pkg:github/aws-cloudformation/cloudformation-languageserver@v1.14.0
  asset:
    - target: darwin_arm64
      file: cloudformation-languageserver-{{version | strip_prefix "v"}}-darwin-arm64-node24.zip
      file: cfn-lsp-server-standalone.js
    - target: linux_arm64_gnu
      file: cloudformation-languageserver-{{version | strip_prefix "v"}}-linux-arm64-node24.zip
      file: cfn-lsp-server-standalone.js
    - target: linux_x64_gnu
      file: cloudformation-languageserver-{{version | strip_prefix "v"}}-linux-x64-node24.zip
      file: cfn-lsp-server-standalone.js
bin:
  cfp-lsp: node:{{source.asset.file}}
